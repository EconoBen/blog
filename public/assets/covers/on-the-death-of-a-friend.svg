<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bgRadial6" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#dce5f4"/>
      <stop offset="100%" stop-color="#e8eef8"/>
    </radialGradient>
    <radialGradient id="innerGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef9ef" stop-opacity="0.12"/>
      <stop offset="30%" stop-color="#fef9ef" stop-opacity="0.06"/>
      <stop offset="60%" stop-color="#fef9ef" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#fef9ef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreLight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef9ef" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#fef9ef" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#fef9ef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="outerFade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#95a0b4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#95a0b4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background — slightly warmer dark -->
  <rect width="1200" height="630" fill="url(#bgRadial6)"/>

  <!-- Outermost fading rings -->
  <ellipse cx="600" cy="315" rx="280" ry="280" fill="url(#outerFade)"/>
  <circle cx="600" cy="315" r="220" fill="none" stroke="#95a0b4" stroke-opacity="0.03" stroke-width="1"/>
  <circle cx="600" cy="315" r="180" fill="none" stroke="#95a0b4" stroke-opacity="0.04" stroke-width="0.5"/>

  <!-- Gentle outer glow -->
  <ellipse cx="600" cy="315" rx="160" ry="160" fill="url(#innerGlow)"/>

  <!-- Middle soft ring -->
  <circle cx="600" cy="315" r="120" fill="none" stroke="#fef9ef" stroke-opacity="0.04" stroke-width="0.8"/>

  <!-- Core glow -->
  <ellipse cx="600" cy="315" rx="90" ry="90" fill="url(#coreLight)"/>

  <!-- The single circle — quiet, centered -->
  <circle cx="600" cy="315" r="60" fill="none" stroke="#fef9ef" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Inner circle — barely there -->
  <circle cx="600" cy="315" r="40" fill="#fef9ef" fill-opacity="0.03"/>
  <circle cx="600" cy="315" r="40" fill="none" stroke="#fef9ef" stroke-opacity="0.08" stroke-width="0.5"/>

  <!-- Soft center point -->
  <circle cx="600" cy="315" r="4" fill="#fef9ef" fill-opacity="0.15"/>

  <!-- Very subtle floating motes — memories fading -->
  <circle cx="500" cy="250" r="1" fill="#fef9ef" opacity="0.06"/>
  <circle cx="720" cy="370" r="1.2" fill="#fef9ef" opacity="0.05"/>
  <circle cx="560" cy="400" r="0.8" fill="#fef9ef" opacity="0.04"/>
  <circle cx="660" cy="230" r="1" fill="#fef9ef" opacity="0.05"/>
  <circle cx="480" cy="340" r="0.8" fill="#fef9ef" opacity="0.04"/>
  <circle cx="740" cy="280" r="1" fill="#fef9ef" opacity="0.05"/>
</svg>
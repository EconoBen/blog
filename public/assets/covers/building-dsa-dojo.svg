<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d1c16"/>
      <stop offset="100%" stop-color="#2a2920"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#004ac6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#004ac6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9ef" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fef9ef" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines (terminal aesthetic) -->
  <g stroke="#555f70" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Ascending stepped blocks (ladder pattern) -->
  <g>
    <!-- Step 1 (lowest, leftmost) -->
    <rect x="160" y="480" width="100" height="60" rx="4" fill="url(#stepGrad)" opacity="0.5"/>
    <rect x="160" y="480" width="100" height="60" rx="4" fill="none" stroke="#004ac6" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Step 2 -->
    <rect x="280" y="420" width="100" height="120" rx="4" fill="url(#stepGrad)" opacity="0.55"/>
    <rect x="280" y="420" width="100" height="120" rx="4" fill="none" stroke="#004ac6" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Step 3 -->
    <rect x="400" y="355" width="100" height="185" rx="4" fill="url(#stepGrad)" opacity="0.6"/>
    <rect x="400" y="355" width="100" height="185" rx="4" fill="none" stroke="#004ac6" stroke-width="1.5" stroke-opacity="0.55"/>

    <!-- Step 4 -->
    <rect x="520" y="285" width="100" height="255" rx="4" fill="url(#stepGrad)" opacity="0.65"/>
    <rect x="520" y="285" width="100" height="255" rx="4" fill="none" stroke="#004ac6" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Step 5 -->
    <rect x="640" y="220" width="100" height="320" rx="4" fill="url(#stepGrad)" opacity="0.72"/>
    <rect x="640" y="220" width="100" height="320" rx="4" fill="none" stroke="#004ac6" stroke-width="1.5" stroke-opacity="0.65"/>

    <!-- Step 6 -->
    <rect x="760" y="160" width="100" height="380" rx="4" fill="url(#stepGrad)" opacity="0.8"/>
    <rect x="760" y="160" width="100" height="380" rx="4" fill="none" stroke="#004ac6" stroke-width="1.5" stroke-opacity="0.7"/>

    <!-- Step 7 (tallest) -->
    <rect x="880" y="100" width="100" height="440" rx="4" fill="url(#stepGrad)" opacity="0.9"/>
    <rect x="880" y="100" width="100" height="440" rx="4" fill="none" stroke="#004ac6" stroke-width="1.5" stroke-opacity="0.8"/>
  </g>

  <!-- Connecting dotted path (progression line) -->
  <path d="M210 475 L330 415 L450 350 L570 280 L690 215 L810 155 L930 95"
        fill="none" stroke="#fef9ef" stroke-width="2" stroke-dasharray="6 4" stroke-opacity="0.35"/>

  <!-- Node dots on the path -->
  <circle cx="210" cy="475" r="4" fill="#fef9ef" opacity="0.5"/>
  <circle cx="330" cy="415" r="4" fill="#fef9ef" opacity="0.55"/>
  <circle cx="450" cy="350" r="4" fill="#fef9ef" opacity="0.6"/>
  <circle cx="570" cy="280" r="4" fill="#fef9ef" opacity="0.65"/>
  <circle cx="690" cy="215" r="4" fill="#fef9ef" opacity="0.7"/>
  <circle cx="810" cy="155" r="4" fill="#fef9ef" opacity="0.8"/>
  <circle cx="930" cy="95" r="5" fill="#fef9ef" opacity="0.95"/>

  <!-- Terminal cursor blinking elements -->
  <rect x="930" y="82" width="12" height="3" rx="1" fill="#004ac6" opacity="0.9"/>

  <!-- Small terminal bracket accents -->
  <g stroke="#555f70" stroke-width="1.5" fill="none" opacity="0.2">
    <polyline points="120,520 130,520 130,540 120,540"/>
    <polyline points="1060,80 1070,80 1070,100 1060,100"/>
  </g>

  <!-- Subtle glow at top of tallest bar -->
  <ellipse cx="930" cy="90" rx="60" ry="30" fill="url(#glowGrad)"/>

  <!-- Corner accents -->
  <line x1="30" y1="30" x2="70" y2="30" stroke="#555f70" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="30" y1="30" x2="30" y2="70" stroke="#555f70" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="1170" y1="600" x2="1130" y2="600" stroke="#555f70" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="1170" y1="600" x2="1170" y2="560" stroke="#555f70" stroke-width="1" stroke-opacity="0.25"/>
</svg>
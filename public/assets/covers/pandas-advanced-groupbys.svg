<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eef8"/>
      <stop offset="100%" stop-color="#dce5f4"/>
    </linearGradient>
    <linearGradient id="colBlue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#004ac6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#004ac6" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="colCream" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fef9ef" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#fef9ef" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="colGrey" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#95a0b4" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#95a0b4" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg5)"/>

  <!-- Grid lines (table structure) -->
  <g stroke="#95a0b4" stroke-opacity="0.06" stroke-width="1">
    <!-- Horizontal rows -->
    <line x1="140" y1="100" x2="1060" y2="100"/>
    <line x1="140" y1="160" x2="1060" y2="160"/>
    <line x1="140" y1="220" x2="1060" y2="220"/>
    <line x1="140" y1="280" x2="1060" y2="280"/>
    <line x1="140" y1="340" x2="1060" y2="340"/>
    <line x1="140" y1="400" x2="1060" y2="400"/>
    <line x1="140" y1="460" x2="1060" y2="460"/>
    <line x1="140" y1="520" x2="1060" y2="520"/>
  </g>

  <!-- GROUP A — Blue columns -->
  <g>
    <rect x="180" y="120" width="50" height="390" rx="4" fill="url(#colBlue)"/>
    <rect x="250" y="120" width="50" height="390" rx="4" fill="url(#colBlue)"/>
    <rect x="320" y="120" width="50" height="390" rx="4" fill="url(#colBlue)"/>

    <!-- Group bracket -->
    <path d="M 180 110 L 180 105 L 370 105 L 370 110" fill="none" stroke="#004ac6" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="275" cy="100" r="4" fill="#004ac6" fill-opacity="0.5"/>

    <!-- Cell highlights in group A -->
    <rect x="185" y="165" width="40" height="10" rx="2" fill="#004ac6" fill-opacity="0.25"/>
    <rect x="185" y="225" width="40" height="10" rx="2" fill="#004ac6" fill-opacity="0.2"/>
    <rect x="185" y="285" width="40" height="10" rx="2" fill="#004ac6" fill-opacity="0.25"/>
    <rect x="185" y="345" width="40" height="10" rx="2" fill="#004ac6" fill-opacity="0.15"/>
    <rect x="185" y="405" width="40" height="10" rx="2" fill="#004ac6" fill-opacity="0.2"/>
    <rect x="185" y="465" width="40" height="10" rx="2" fill="#004ac6" fill-opacity="0.25"/>

    <rect x="255" y="165" width="40" height="10" rx="2" fill="#004ac6" fill-opacity="0.15"/>
    <rect x="255" y="225" width="40" height="10" rx="2" fill="#004ac6" fill-opacity="0.2"/>
    <rect x="255" y="345" width="40" height="10" rx="2" fill="#004ac6" fill-opacity="0.15"/>
    <rect x="255" y="465" width="40" height="10" rx="2" fill="#004ac6" fill-opacity="0.2"/>

    <rect x="325" y="165" width="40" height="10" rx="2" fill="#004ac6" fill-opacity="0.2"/>
    <rect x="325" y="285" width="40" height="10" rx="2" fill="#004ac6" fill-opacity="0.15"/>
    <rect x="325" y="405" width="40" height="10" rx="2" fill="#004ac6" fill-opacity="0.2"/>
  </g>

  <!-- GROUP B — Cream columns -->
  <g>
    <rect x="430" y="120" width="50" height="390" rx="4" fill="url(#colCream)"/>
    <rect x="500" y="120" width="50" height="390" rx="4" fill="url(#colCream)"/>

    <!-- Group bracket -->
    <path d="M 430 110 L 430 105 L 550 105 L 550 110" fill="none" stroke="#fef9ef" stroke-opacity="0.25" stroke-width="1.5"/>
    <circle cx="490" cy="100" r="4" fill="#fef9ef" fill-opacity="0.3"/>

    <!-- Cell highlights -->
    <rect x="435" y="165" width="40" height="10" rx="2" fill="#fef9ef" fill-opacity="0.1"/>
    <rect x="435" y="225" width="40" height="10" rx="2" fill="#fef9ef" fill-opacity="0.12"/>
    <rect x="435" y="345" width="40" height="10" rx="2" fill="#fef9ef" fill-opacity="0.1"/>
    <rect x="435" y="465" width="40" height="10" rx="2" fill="#fef9ef" fill-opacity="0.12"/>

    <rect x="505" y="165" width="40" height="10" rx="2" fill="#fef9ef" fill-opacity="0.08"/>
    <rect x="505" y="285" width="40" height="10" rx="2" fill="#fef9ef" fill-opacity="0.1"/>
    <rect x="505" y="405" width="40" height="10" rx="2" fill="#fef9ef" fill-opacity="0.08"/>
  </g>

  <!-- GROUP C — Grey columns -->
  <g>
    <rect x="610" y="120" width="50" height="390" rx="4" fill="url(#colGrey)"/>
    <rect x="680" y="120" width="50" height="390" rx="4" fill="url(#colGrey)"/>
    <rect x="750" y="120" width="50" height="390" rx="4" fill="url(#colGrey)"/>

    <!-- Group bracket -->
    <path d="M 610 110 L 610 105 L 800 105 L 800 110" fill="none" stroke="#95a0b4" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="705" cy="100" r="4" fill="#95a0b4" fill-opacity="0.4"/>

    <!-- Cell highlights -->
    <rect x="615" y="165" width="40" height="10" rx="2" fill="#95a0b4" fill-opacity="0.15"/>
    <rect x="615" y="285" width="40" height="10" rx="2" fill="#95a0b4" fill-opacity="0.12"/>
    <rect x="615" y="405" width="40" height="10" rx="2" fill="#95a0b4" fill-opacity="0.15"/>

    <rect x="685" y="225" width="40" height="10" rx="2" fill="#95a0b4" fill-opacity="0.12"/>
    <rect x="685" y="345" width="40" height="10" rx="2" fill="#95a0b4" fill-opacity="0.1"/>
    <rect x="685" y="465" width="40" height="10" rx="2" fill="#95a0b4" fill-opacity="0.12"/>

    <rect x="755" y="165" width="40" height="10" rx="2" fill="#95a0b4" fill-opacity="0.1"/>
    <rect x="755" y="285" width="40" height="10" rx="2" fill="#95a0b4" fill-opacity="0.12"/>
    <rect x="755" y="405" width="40" height="10" rx="2" fill="#95a0b4" fill-opacity="0.1"/>
  </g>

  <!-- Aggregation result panel on right -->
  <g transform="translate(880, 120)">
    <rect x="0" y="0" width="160" height="390" rx="6" fill="none" stroke="#004ac6" stroke-opacity="0.2" stroke-width="1.5"/>

    <!-- Aggregated bars (results of groupby) -->
    <rect x="20" y="30" width="100" height="12" rx="3" fill="#004ac6" fill-opacity="0.35"/>
    <rect x="20" y="60" width="70" height="12" rx="3" fill="#004ac6" fill-opacity="0.3"/>
    <rect x="20" y="90" width="120" height="12" rx="3" fill="#004ac6" fill-opacity="0.25"/>

    <rect x="20" y="140" width="80" height="12" rx="3" fill="#fef9ef" fill-opacity="0.15"/>
    <rect x="20" y="170" width="110" height="12" rx="3" fill="#fef9ef" fill-opacity="0.12"/>

    <rect x="20" y="220" width="90" height="12" rx="3" fill="#95a0b4" fill-opacity="0.2"/>
    <rect x="20" y="250" width="60" height="12" rx="3" fill="#95a0b4" fill-opacity="0.15"/>
    <rect x="20" y="280" width="130" height="12" rx="3" fill="#95a0b4" fill-opacity="0.18"/>

    <!-- Arrow from groups to result -->
    <line x1="-20" y1="195" x2="0" y2="195" stroke="#004ac6" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Flow arrows from groups to result panel -->
  <g stroke="#004ac6" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="6 4">
    <path d="M 370 315 C 500 315, 750 200, 880 260" fill="none"/>
    <path d="M 550 315 C 650 315, 760 280, 880 300" fill="none"/>
    <path d="M 800 315 C 830 315, 850 310, 880 315" fill="none"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgLoan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d1c16"/>
      <stop offset="100%" stop-color="#23221b"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#004ac6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#004ac6" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="barGradFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#004ac6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#004ac6" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="successGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fef9ef" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#fef9ef" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgLoan)"/>

  <!-- Baseline -->
  <line x1="120" y1="530" x2="1080" y2="530" stroke="#555f70" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Descending bars (6 years of reducing debt) -->
  <!-- Year 1: tallest (194k) -->
  <rect x="170" y="110" width="110" height="420" rx="3" fill="url(#barGrad)" opacity="0.85"/>
  <rect x="170" y="110" width="110" height="420" rx="3" fill="none" stroke="#004ac6" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Year 2 -->
  <rect x="310" y="180" width="110" height="350" rx="3" fill="url(#barGrad)" opacity="0.75"/>
  <rect x="310" y="180" width="110" height="350" rx="3" fill="none" stroke="#004ac6" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Year 3 -->
  <rect x="450" y="255" width="110" height="275" rx="3" fill="url(#barGrad)" opacity="0.65"/>
  <rect x="450" y="255" width="110" height="275" rx="3" fill="none" stroke="#004ac6" stroke-width="1" stroke-opacity="0.22"/>

  <!-- Year 4 -->
  <rect x="590" y="330" width="110" height="200" rx="3" fill="url(#barGradFade)" opacity="0.7"/>
  <rect x="590" y="330" width="110" height="200" rx="3" fill="none" stroke="#004ac6" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Year 5 -->
  <rect x="730" y="400" width="110" height="130" rx="3" fill="url(#barGradFade)" opacity="0.6"/>
  <rect x="730" y="400" width="110" height="130" rx="3" fill="none" stroke="#004ac6" stroke-width="1" stroke-opacity="0.18"/>

  <!-- Year 6: shortest (nearly gone) -->
  <rect x="870" y="475" width="110" height="55" rx="3" fill="url(#barGradFade)" opacity="0.5"/>
  <rect x="870" y="475" width="110" height="55" rx="3" fill="none" stroke="#004ac6" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Downward trend line connecting bar tops -->
  <path d="M225 110 L365 180 L505 255 L645 330 L785 400 L925 475"
        fill="none" stroke="#fef9ef" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 4"/>

  <!-- Trend arrow at end -->
  <polygon points="930,478 920,470 922,480" fill="#fef9ef" opacity="0.3"/>

  <!-- Freedom marker at the end (small burst) -->
  <g transform="translate(980, 480)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#fef9ef" stroke-width="1" stroke-opacity="0.15"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#fef9ef" stroke-width="1" stroke-opacity="0.2"/>
    <circle cx="0" cy="0" r="3" fill="#fef9ef" opacity="0.35"/>
    <!-- Tiny radiating lines -->
    <line x1="0" y1="-18" x2="0" y2="-25" stroke="#fef9ef" stroke-width="1" stroke-opacity="0.15"/>
    <line x1="18" y1="0" x2="25" y2="0" stroke="#fef9ef" stroke-width="1" stroke-opacity="0.15"/>
    <line x1="0" y1="18" x2="0" y2="25" stroke="#fef9ef" stroke-width="1" stroke-opacity="0.15"/>
    <line x1="-18" y1="0" x2="-25" y2="0" stroke="#fef9ef" stroke-width="1" stroke-opacity="0.15"/>
    <line x1="13" y1="-13" x2="18" y2="-18" stroke="#fef9ef" stroke-width="0.75" stroke-opacity="0.1"/>
    <line x1="13" y1="13" x2="18" y2="18" stroke="#fef9ef" stroke-width="0.75" stroke-opacity="0.1"/>
    <line x1="-13" y1="-13" x2="-18" y2="-18" stroke="#fef9ef" stroke-width="0.75" stroke-opacity="0.1"/>
    <line x1="-13" y1="13" x2="-18" y2="18" stroke="#fef9ef" stroke-width="0.75" stroke-opacity="0.1"/>
  </g>

  <!-- Weight/pressure indicator lines above tallest bar -->
  <g stroke="#555f70" stroke-width="0.5" stroke-opacity="0.1">
    <line x1="175" y1="95" x2="275" y2="95"/>
    <line x1="180" y1="85" x2="270" y2="85"/>
    <line x1="185" y1="75" x2="265" y2="75"/>
  </g>

  <!-- Subtle grid ticks on y-axis -->
  <g stroke="#555f70" stroke-width="0.75" stroke-opacity="0.1">
    <line x1="115" y1="170" x2="125" y2="170"/>
    <line x1="115" y1="260" x2="125" y2="260"/>
    <line x1="115" y1="350" x2="125" y2="350"/>
    <line x1="115" y1="440" x2="125" y2="440"/>
  </g>

  <!-- Reduced amount area fill (under the curve) -->
  <path d="M225 110 L365 180 L505 255 L645 330 L785 400 L925 475 L925 530 L225 530 Z"
        fill="url(#successGrad)" opacity="0.15"/>

  <!-- Corner accents -->
  <line x1="30" y1="30" x2="70" y2="30" stroke="#555f70" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="30" y1="30" x2="30" y2="70" stroke="#555f70" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="1170" y1="600" x2="1130" y2="600" stroke="#555f70" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="1170" y1="600" x2="1170" y2="560" stroke="#555f70" stroke-width="1" stroke-opacity="0.25"/>
</svg>
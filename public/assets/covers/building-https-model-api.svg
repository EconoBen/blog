<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8eef8"/>
      <stop offset="100%" stop-color="#dce5f4"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#004ac6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#004ac6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="creamFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef9ef" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fef9ef" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#95a0b4" stroke-opacity="0.08" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
  </g>

  <!-- Server stack — layered rectangles -->
  <g transform="translate(600, 315)">
    <!-- Bottom layer (infrastructure) -->
    <rect x="-220" y="60" width="440" height="70" rx="6" fill="#e8eef8" stroke="#95a0b4" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="-210" y="65" width="420" height="60" rx="4" fill="url(#creamFade)"/>
    <g transform="translate(-180, 80)">
      <circle r="4" fill="#95a0b4" opacity="0.5"/>
      <circle r="4" cx="20" fill="#95a0b4" opacity="0.5"/>
      <circle r="4" cx="40" fill="#95a0b4" opacity="0.5"/>
    </g>

    <!-- Middle layer (server) -->
    <rect x="-200" y="-15" width="400" height="70" rx="6" fill="#dce5f4" stroke="#004ac6" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="-190" y="-10" width="380" height="60" rx="4" fill="#004ac6" fill-opacity="0.08"/>
    <g transform="translate(-160, 5)">
      <circle r="4" fill="#004ac6" opacity="0.6"/>
      <circle r="4" cx="20" fill="#004ac6" opacity="0.6"/>
      <circle r="4" cx="40" fill="#004ac6" opacity="0.4"/>
    </g>
    <rect x="80" y="-2" width="100" height="8" rx="2" fill="#004ac6" fill-opacity="0.2"/>
    <rect x="80" y="14" width="70" height="8" rx="2" fill="#004ac6" fill-opacity="0.15"/>
    <rect x="80" y="30" width="90" height="8" rx="2" fill="#004ac6" fill-opacity="0.1"/>

    <!-- Top layer (API/cloud) -->
    <rect x="-180" y="-90" width="360" height="70" rx="6" fill="#dce5f4" stroke="#004ac6" stroke-opacity="0.8" stroke-width="2"/>
    <rect x="-170" y="-85" width="340" height="60" rx="4" fill="#004ac6" fill-opacity="0.15"/>
    <g transform="translate(-140, -70)">
      <circle r="5" fill="#004ac6" opacity="0.8"/>
      <circle r="5" cx="22" fill="#004ac6" opacity="0.8"/>
      <circle r="5" cx="44" fill="#fef9ef" opacity="0.4"/>
    </g>
    <rect x="60" y="-77" width="110" height="8" rx="2" fill="#fef9ef" fill-opacity="0.12"/>
    <rect x="60" y="-61" width="80" height="8" rx="2" fill="#fef9ef" fill-opacity="0.08"/>
    <rect x="60" y="-45" width="95" height="8" rx="2" fill="#fef9ef" fill-opacity="0.06"/>
  </g>

  <!-- Connection lines from layers -->
  <g stroke="#004ac6" stroke-width="1.5" fill="none">
    <!-- Vertical connectors between layers -->
    <line x1="440" y1="305" x2="440" y2="320" stroke-opacity="0.4"/>
    <line x1="760" y1="305" x2="760" y2="320" stroke-opacity="0.4"/>
    <line x1="460" y1="380" x2="460" y2="395" stroke-opacity="0.3"/>
    <line x1="740" y1="380" x2="740" y2="395" stroke-opacity="0.3"/>

    <!-- Outgoing connection paths -->
    <path d="M 420 230 C 300 230, 200 180, 120 160" stroke-opacity="0.3"/>
    <path d="M 780 230 C 900 230, 1000 180, 1080 160" stroke-opacity="0.3"/>
    <path d="M 420 245 C 280 260, 160 230, 80 250" stroke-opacity="0.2"/>
    <path d="M 780 245 C 920 260, 1040 230, 1120 250" stroke-opacity="0.2"/>
  </g>

  <!-- Floating endpoint dots -->
  <circle cx="120" cy="160" r="5" fill="#004ac6" opacity="0.5"/>
  <circle cx="1080" cy="160" r="5" fill="#004ac6" opacity="0.5"/>
  <circle cx="80" cy="250" r="4" fill="#fef9ef" opacity="0.2"/>
  <circle cx="1120" cy="250" r="4" fill="#fef9ef" opacity="0.2"/>

  <!-- Cloud shape suggestion at top -->
  <g transform="translate(600, 100)" fill="none" stroke="#004ac6" stroke-opacity="0.15" stroke-width="1.5">
    <ellipse cx="0" cy="0" rx="80" ry="40"/>
    <ellipse cx="-50" cy="10" rx="50" ry="30"/>
    <ellipse cx="50" cy="10" rx="50" ry="30"/>
  </g>

  <!-- Lock icon hint (HTTPS) -->
  <g transform="translate(600, 165)" fill="none" stroke="#fef9ef" stroke-opacity="0.2" stroke-width="1.5">
    <rect x="-10" y="-2" width="20" height="16" rx="3"/>
    <path d="M -6 -2 L -6 -8 C -6 -14, 6 -14, 6 -8 L 6 -2"/>
  </g>

  <!-- Accent dots scattered -->
  <circle cx="150" cy="500" r="2" fill="#004ac6" opacity="0.3"/>
  <circle cx="300" cy="530" r="1.5" fill="#fef9ef" opacity="0.15"/>
  <circle cx="900" cy="480" r="2" fill="#004ac6" opacity="0.25"/>
  <circle cx="1050" cy="520" r="1.5" fill="#fef9ef" opacity="0.15"/>
</svg>
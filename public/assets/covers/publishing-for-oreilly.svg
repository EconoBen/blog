<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgPub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8eef8"/>
      <stop offset="100%" stop-color="#dce5f4"/>
    </linearGradient>
    <linearGradient id="pageGradL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#fef9ef" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#fef9ef" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="pageGradR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef9ef" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#fef9ef" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#004ac6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#004ac6" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="radGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#004ac6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#004ac6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgPub)"/>

  <!-- Radial glow behind book -->
  <ellipse cx="600" cy="300" rx="350" ry="250" fill="url(#radGlow)"/>

  <!-- Radiating lines from spine (knowledge emanating) -->
  <g stroke="#004ac6" stroke-width="1" fill="none">
    <line x1="600" y1="250" x2="400" y2="80" stroke-opacity="0.08"/>
    <line x1="600" y1="250" x2="500" y2="60" stroke-opacity="0.1"/>
    <line x1="600" y1="250" x2="600" y2="50" stroke-opacity="0.12"/>
    <line x1="600" y1="250" x2="700" y2="60" stroke-opacity="0.1"/>
    <line x1="600" y1="250" x2="800" y2="80" stroke-opacity="0.08"/>

    <line x1="600" y1="270" x2="300" y2="160" stroke-opacity="0.06"/>
    <line x1="600" y1="270" x2="900" y2="160" stroke-opacity="0.06"/>
    <line x1="600" y1="260" x2="350" y2="110" stroke-opacity="0.07"/>
    <line x1="600" y1="260" x2="850" y2="110" stroke-opacity="0.07"/>
  </g>

  <!-- Open book — left page -->
  <path d="M595 260 L310 220 L310 480 L595 450 Z" fill="url(#pageGradL)" stroke="#95a0b4" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Left page text lines (abstract) -->
  <g stroke="#95a0b4" stroke-opacity="0.08" stroke-width="1">
    <line x1="345" y1="260" x2="560" y2="282"/>
    <line x1="345" y1="280" x2="540" y2="300"/>
    <line x1="345" y1="300" x2="555" y2="318"/>
    <line x1="345" y1="320" x2="520" y2="336"/>
    <line x1="345" y1="340" x2="560" y2="354"/>
    <line x1="345" y1="360" x2="535" y2="372"/>
    <line x1="345" y1="380" x2="555" y2="390"/>
    <line x1="345" y1="400" x2="510" y2="408"/>
    <line x1="345" y1="420" x2="560" y2="426"/>
  </g>

  <!-- Open book — right page -->
  <path d="M605 260 L890 220 L890 480 L605 450 Z" fill="url(#pageGradR)" stroke="#95a0b4" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Right page text lines (abstract) -->
  <g stroke="#95a0b4" stroke-opacity="0.08" stroke-width="1">
    <line x1="640" y1="282" x2="855" y2="260"/>
    <line x1="640" y1="300" x2="860" y2="280"/>
    <line x1="640" y1="318" x2="855" y2="300"/>
    <line x1="640" y1="336" x2="830" y2="320"/>
    <line x1="640" y1="354" x2="855" y2="340"/>
    <line x1="640" y1="372" x2="840" y2="360"/>
    <line x1="640" y1="390" x2="855" y2="380"/>
    <line x1="640" y1="408" x2="820" y2="400"/>
    <line x1="640" y1="426" x2="855" y2="420"/>
  </g>

  <!-- Book spine -->
  <line x1="600" y1="250" x2="600" y2="455" stroke="url(#spineGrad)" stroke-width="3"/>

  <!-- Page curve hints -->
  <path d="M310 220 Q450 240 595 260" fill="none" stroke="#95a0b4" stroke-width="0.5" stroke-opacity="0.15"/>
  <path d="M890 220 Q740 240 605 260" fill="none" stroke="#95a0b4" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- Floating particles (knowledge spreading) -->
  <g fill="#004ac6">
    <circle cx="440" cy="120" r="3" opacity="0.2"/>
    <circle cx="520" cy="90" r="2.5" opacity="0.25"/>
    <circle cx="600" cy="75" r="3.5" opacity="0.3"/>
    <circle cx="680" cy="90" r="2.5" opacity="0.25"/>
    <circle cx="760" cy="120" r="3" opacity="0.2"/>

    <circle cx="360" cy="150" r="2" opacity="0.15"/>
    <circle cx="840" cy="150" r="2" opacity="0.15"/>

    <circle cx="470" cy="100" r="1.5" opacity="0.18"/>
    <circle cx="730" cy="100" r="1.5" opacity="0.18"/>
  </g>

  <!-- Small diamond accents (floating above book) -->
  <g fill="#fef9ef" opacity="0.12">
    <rect x="548" y="100" width="5" height="5" transform="rotate(45 550.5 102.5)"/>
    <rect x="648" y="95" width="5" height="5" transform="rotate(45 650.5 97.5)"/>
    <rect x="498" y="130" width="4" height="4" transform="rotate(45 500 132)"/>
    <rect x="698" y="125" width="4" height="4" transform="rotate(45 700 127)"/>
  </g>

  <!-- Decorative brackets (print/publishing motif) -->
  <g stroke="#004ac6" stroke-width="1.5" fill="none" stroke-opacity="0.15">
    <!-- Left bracket -->
    <path d="M240 300 L225 300 L225 380 L240 380"/>
    <!-- Right bracket -->
    <path d="M960 300 L975 300 L975 380 L960 380"/>
  </g>

  <!-- Subtle page stack underneath -->
  <line x1="315" y1="485" x2="885" y2="485" stroke="#95a0b4" stroke-width="0.5" stroke-opacity="0.1"/>
  <line x1="318" y1="490" x2="882" y2="490" stroke="#95a0b4" stroke-width="0.5" stroke-opacity="0.07"/>
  <line x1="321" y1="495" x2="879" y2="495" stroke="#95a0b4" stroke-width="0.5" stroke-opacity="0.04"/>

  <!-- Corner accents -->
  <line x1="30" y1="30" x2="70" y2="30" stroke="#95a0b4" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="30" y1="30" x2="30" y2="70" stroke="#95a0b4" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="1170" y1="600" x2="1130" y2="600" stroke="#95a0b4" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="1170" y1="600" x2="1170" y2="560" stroke="#95a0b4" stroke-width="1" stroke-opacity="0.25"/>
</svg>
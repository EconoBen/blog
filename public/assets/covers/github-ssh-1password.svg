<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#e8eef8"/>
      <stop offset="100%" stop-color="#dce5f4"/>
    </linearGradient>
    <radialGradient id="keyGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#004ac6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#004ac6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pathGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#004ac6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#004ac6" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="pathGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef9ef" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fef9ef" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg2)"/>

  <!-- Ambient glow behind key -->
  <ellipse cx="360" cy="315" rx="200" ry="200" fill="url(#keyGlow)"/>

  <!-- Key shape — abstract -->
  <g transform="translate(360, 290)">
    <!-- Key ring (circle) -->
    <circle cx="0" cy="0" r="65" fill="none" stroke="#004ac6" stroke-width="3" stroke-opacity="0.7"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#004ac6" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="0" cy="0" r="25" fill="#004ac6" fill-opacity="0.1" stroke="#004ac6" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Inner key detail -->
    <circle cx="0" cy="0" r="8" fill="#004ac6" fill-opacity="0.4"/>

    <!-- Key shaft -->
    <line x1="65" y1="0" x2="200" y2="0" stroke="#004ac6" stroke-width="3" stroke-opacity="0.6"/>

    <!-- Key teeth -->
    <line x1="160" y1="0" x2="160" y2="20" stroke="#004ac6" stroke-width="2.5" stroke-opacity="0.5"/>
    <line x1="180" y1="0" x2="180" y2="15" stroke="#004ac6" stroke-width="2.5" stroke-opacity="0.5"/>
    <line x1="200" y1="0" x2="200" y2="22" stroke="#004ac6" stroke-width="2.5" stroke-opacity="0.5"/>
  </g>

  <!-- Lock shape — abstract -->
  <g transform="translate(360, 290)">
    <!-- Lock body at center of ring -->
    <rect x="-12" y="-8" width="24" height="18" rx="3" fill="none" stroke="#fef9ef" stroke-width="1.5" stroke-opacity="0.35"/>
    <path d="M -6 -8 L -6 -16 C -6 -24, 6 -24, 6 -16 L 6 -8" fill="none" stroke="#fef9ef" stroke-width="1.5" stroke-opacity="0.35"/>
  </g>

  <!-- Branching paths — multiple identities -->
  <g fill="none" stroke-width="2" stroke-linecap="round">
    <!-- Path 1 — upper branch -->
    <path d="M 560 290 C 620 290, 660 200, 740 180 C 820 160, 880 170, 960 160 L 1080 140"
          stroke="url(#pathGrad1)" stroke-width="2.5"/>
    <circle cx="1080" cy="140" r="8" fill="none" stroke="#004ac6" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="1080" cy="140" r="3" fill="#004ac6" fill-opacity="0.6"/>

    <!-- Path 2 — middle branch -->
    <path d="M 560 290 C 640 290, 700 300, 780 310 C 860 320, 920 315, 1000 315 L 1080 315"
          stroke="url(#pathGrad2)" stroke-width="2"/>
    <circle cx="1080" cy="315" r="8" fill="none" stroke="#fef9ef" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="1080" cy="315" r="3" fill="#fef9ef" fill-opacity="0.4"/>

    <!-- Path 3 — lower branch -->
    <path d="M 560 290 C 620 290, 660 380, 740 420 C 820 460, 880 470, 960 480 L 1080 490"
          stroke="#95a0b4" stroke-opacity="0.4" stroke-width="2"/>
    <circle cx="1080" cy="490" r="8" fill="none" stroke="#95a0b4" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="1080" cy="490" r="3" fill="#95a0b4" fill-opacity="0.4"/>
  </g>

  <!-- Node dots along paths -->
  <circle cx="660" cy="240" r="3" fill="#004ac6" opacity="0.4"/>
  <circle cx="780" cy="175" r="3" fill="#004ac6" opacity="0.3"/>
  <circle cx="880" cy="165" r="2.5" fill="#004ac6" opacity="0.25"/>

  <circle cx="700" cy="300" r="3" fill="#fef9ef" opacity="0.2"/>
  <circle cx="850" cy="315" r="3" fill="#fef9ef" opacity="0.15"/>

  <circle cx="660" cy="360" r="3" fill="#95a0b4" opacity="0.3"/>
  <circle cx="800" cy="440" r="3" fill="#95a0b4" opacity="0.25"/>

  <!-- Subtle fingerprint/identity arcs around key ring -->
  <g transform="translate(360, 290)" fill="none" stroke="#fef9ef" stroke-opacity="0.06" stroke-width="1">
    <circle r="85"/>
    <circle r="95"/>
    <circle r="105"/>
  </g>

  <!-- Small accent shapes -->
  <rect x="100" y="100" width="30" height="30" rx="4" fill="none" stroke="#95a0b4" stroke-opacity="0.1" stroke-width="1" transform="rotate(15, 115, 115)"/>
  <rect x="100" y="470" width="25" height="25" rx="4" fill="none" stroke="#004ac6" stroke-opacity="0.08" stroke-width="1" transform="rotate(-10, 112, 482)"/>
</svg>
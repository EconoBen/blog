<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#e8eef8"/>
      <stop offset="100%" stop-color="#dce5f4"/>
    </linearGradient>
    <linearGradient id="cleanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#004ac6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#004ac6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="tangleFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#95a0b4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#95a0b4" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg4)"/>

  <!-- Central vertical divider — transformation boundary -->
  <line x1="600" y1="80" x2="600" y2="550" stroke="#fef9ef" stroke-opacity="0.06" stroke-width="1"/>

  <!-- LEFT SIDE: Tangled, chaotic lines (legacy) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tangled line 1 -->
    <path d="M 80 180 C 120 160, 140 220, 180 190 C 220 160, 200 240, 260 210 C 320 180, 280 260, 350 230 C 420 200, 380 280, 440 250 C 500 220, 480 270, 560 240"
          stroke="#95a0b4" stroke-opacity="0.45" stroke-width="2"/>

    <!-- Tangled line 2 -->
    <path d="M 80 260 C 130 290, 150 230, 200 270 C 250 310, 230 240, 290 280 C 350 320, 310 250, 380 290 C 450 330, 400 260, 470 300 C 540 340, 510 280, 560 310"
          stroke="#95a0b4" stroke-opacity="0.4" stroke-width="2"/>

    <!-- Tangled line 3 -->
    <path d="M 80 340 C 140 360, 130 310, 190 350 C 250 390, 220 320, 300 360 C 380 400, 330 330, 410 370 C 490 410, 450 340, 530 380 C 550 390, 555 370, 560 375"
          stroke="#95a0b4" stroke-opacity="0.35" stroke-width="2"/>

    <!-- Tangled line 4 -->
    <path d="M 80 420 C 150 440, 120 390, 200 430 C 280 470, 240 400, 340 440 C 420 460, 380 410, 460 445 C 520 465, 500 430, 560 445"
          stroke="#95a0b4" stroke-opacity="0.3" stroke-width="2"/>

    <!-- Extra crossing chaos strands -->
    <path d="M 120 200 C 180 280, 200 180, 260 270 C 320 360, 300 200, 380 300 C 440 380, 420 240, 500 320"
          stroke="#95a0b4" stroke-opacity="0.12" stroke-width="1.5"/>
    <path d="M 140 380 C 200 300, 250 400, 310 310 C 370 220, 400 360, 460 280 C 520 200, 540 310, 560 270"
          stroke="#95a0b4" stroke-opacity="0.1" stroke-width="1.5"/>
  </g>

  <!-- TRANSITION ZONE: converging arrows / funnel -->
  <g fill="none" stroke="#fef9ef" stroke-opacity="0.12" stroke-width="1">
    <path d="M 560 240 C 580 260, 580 280, 600 290"/>
    <path d="M 560 310 C 575 310, 585 305, 600 310"/>
    <path d="M 560 375 C 580 360, 580 340, 600 330"/>
    <path d="M 560 445 C 580 420, 590 380, 600 350"/>
  </g>

  <!-- Transformation symbol — diamond at center -->
  <g transform="translate(600, 315)">
    <rect x="-18" y="-18" width="36" height="36" rx="4" fill="#e8eef8" stroke="#004ac6" stroke-width="2" stroke-opacity="0.5" transform="rotate(45)"/>
    <rect x="-10" y="-10" width="20" height="20" rx="2" fill="#004ac6" fill-opacity="0.15" transform="rotate(45)"/>
  </g>

  <!-- RIGHT SIDE: Clean, parallel lines (modern) -->
  <g fill="none" stroke-linecap="round">
    <!-- Clean line 1 -->
    <line x1="640" y1="200" x2="1120" y2="200" stroke="#004ac6" stroke-opacity="0.6" stroke-width="2.5"/>
    <circle cx="1120" cy="200" r="4" fill="#004ac6" fill-opacity="0.5"/>

    <!-- Clean line 2 -->
    <line x1="640" y1="270" x2="1120" y2="270" stroke="#004ac6" stroke-opacity="0.5" stroke-width="2.5"/>
    <circle cx="1120" cy="270" r="4" fill="#004ac6" fill-opacity="0.45"/>

    <!-- Clean line 3 -->
    <line x1="640" y1="340" x2="1120" y2="340" stroke="#004ac6" stroke-opacity="0.45" stroke-width="2.5"/>
    <circle cx="1120" cy="340" r="4" fill="#004ac6" fill-opacity="0.4"/>

    <!-- Clean line 4 -->
    <line x1="640" y1="410" x2="1120" y2="410" stroke="#004ac6" stroke-opacity="0.4" stroke-width="2.5"/>
    <circle cx="1120" cy="410" r="4" fill="#004ac6" fill-opacity="0.35"/>
  </g>

  <!-- Clean line start dots -->
  <circle cx="640" cy="200" r="3" fill="#fef9ef" fill-opacity="0.25"/>
  <circle cx="640" cy="270" r="3" fill="#fef9ef" fill-opacity="0.25"/>
  <circle cx="640" cy="340" r="3" fill="#fef9ef" fill-opacity="0.25"/>
  <circle cx="640" cy="410" r="3" fill="#fef9ef" fill-opacity="0.25"/>

  <!-- Even spacing guides on right (subtle) -->
  <g stroke="#004ac6" stroke-opacity="0.05" stroke-width="1" stroke-dasharray="4 8">
    <line x1="640" y1="200" x2="640" y2="410"/>
    <line x1="750" y1="200" x2="750" y2="410"/>
    <line x1="860" y1="200" x2="860" y2="410"/>
    <line x1="970" y1="200" x2="970" y2="410"/>
    <line x1="1080" y1="200" x2="1080" y2="410"/>
  </g>

  <!-- Subtle right-side label blocks -->
  <g fill="#004ac6" fill-opacity="0.06">
    <rect x="660" y="190" width="60" height="6" rx="2"/>
    <rect x="660" y="260" width="45" height="6" rx="2"/>
    <rect x="660" y="330" width="55" height="6" rx="2"/>
    <rect x="660" y="400" width="50" height="6" rx="2"/>
  </g>
</svg>
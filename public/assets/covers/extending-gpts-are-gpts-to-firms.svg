<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgEcon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d1c16"/>
      <stop offset="100%" stop-color="#22211a"/>
    </linearGradient>
    <linearGradient id="curveGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#004ac6" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#004ac6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#004ac6" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="curveGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef9ef" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#fef9ef" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fef9ef" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#004ac6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#004ac6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgEcon)"/>

  <!-- Axes -->
  <line x1="150" y1="80" x2="150" y2="530" stroke="#555f70" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="150" y1="530" x2="1080" y2="530" stroke="#555f70" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Grid lines (horizontal) -->
  <g stroke="#555f70" stroke-width="0.5" stroke-opacity="0.08">
    <line x1="150" y1="170" x2="1080" y2="170"/>
    <line x1="150" y1="260" x2="1080" y2="260"/>
    <line x1="150" y1="350" x2="1080" y2="350"/>
    <line x1="150" y1="440" x2="1080" y2="440"/>
  </g>

  <!-- Grid lines (vertical) -->
  <g stroke="#555f70" stroke-width="0.5" stroke-opacity="0.08">
    <line x1="310" y1="80" x2="310" y2="530"/>
    <line x1="470" y1="80" x2="470" y2="530"/>
    <line x1="630" y1="80" x2="630" y2="530"/>
    <line x1="790" y1="80" x2="790" y2="530"/>
    <line x1="950" y1="80" x2="950" y2="530"/>
  </g>

  <!-- Supply curve (upward sloping) -->
  <path d="M180 480 Q400 420 550 340 Q700 260 850 180 Q950 130 1060 100"
        fill="none" stroke="url(#curveGrad2)" stroke-width="2.5"/>

  <!-- Demand curve (downward sloping) -->
  <path d="M180 120 Q350 180 500 270 Q650 360 800 430 Q920 480 1060 500"
        fill="none" stroke="url(#curveGrad1)" stroke-width="2.5"/>

  <!-- Intersection area glow -->
  <ellipse cx="580" cy="310" rx="80" ry="50" fill="#004ac6" opacity="0.08"/>

  <!-- Intersection point -->
  <circle cx="580" cy="310" r="6" fill="#004ac6" opacity="0.9"/>
  <circle cx="580" cy="310" r="12" fill="none" stroke="#004ac6" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Dashed lines to axes from intersection -->
  <line x1="580" y1="310" x2="580" y2="530" stroke="#004ac6" stroke-width="1" stroke-dasharray="5 4" stroke-opacity="0.25"/>
  <line x1="580" y1="310" x2="150" y2="310" stroke="#004ac6" stroke-width="1" stroke-dasharray="5 4" stroke-opacity="0.25"/>

  <!-- Shift curve (new demand - shifted right, showing AI impact) -->
  <path d="M280 120 Q450 180 600 270 Q750 360 900 430 Q1000 475 1060 490"
        fill="none" stroke="#004ac6" stroke-width="1.5" stroke-dasharray="8 4" stroke-opacity="0.45"/>

  <!-- New intersection point -->
  <circle cx="660" cy="295" r="4" fill="#fef9ef" opacity="0.7"/>
  <circle cx="660" cy="295" r="9" fill="none" stroke="#fef9ef" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Arrow indicating shift -->
  <path d="M595 305 L645 298" fill="none" stroke="#fef9ef" stroke-width="1.5" stroke-opacity="0.35"/>
  <polygon points="645,295 640,292 642,299" fill="#fef9ef" opacity="0.35"/>

  <!-- Area between curves (subtle fill) -->
  <path d="M280 120 Q450 180 600 270 Q650 310 660 295 L580 310 Q500 270 400 220 Q350 195 280 120 Z"
        fill="url(#areaFill)" opacity="0.3"/>

  <!-- Scatter dots (data points) -->
  <g fill="#004ac6" opacity="0.2">
    <circle cx="250" cy="390" r="2.5"/>
    <circle cx="310" cy="350" r="2"/>
    <circle cx="380" cy="330" r="3"/>
    <circle cx="440" cy="310" r="2"/>
    <circle cx="520" cy="320" r="2.5"/>
    <circle cx="620" cy="305" r="2"/>
    <circle cx="700" cy="340" r="3"/>
    <circle cx="770" cy="370" r="2"/>
    <circle cx="850" cy="395" r="2.5"/>
    <circle cx="920" cy="420" r="2"/>
    <circle cx="990" cy="450" r="2.5"/>
  </g>

  <g fill="#fef9ef" opacity="0.12">
    <circle cx="230" cy="440" r="2"/>
    <circle cx="360" cy="370" r="2.5"/>
    <circle cx="480" cy="290" r="2"/>
    <circle cx="550" cy="270" r="2.5"/>
    <circle cx="670" cy="240" r="2"/>
    <circle cx="780" cy="210" r="2.5"/>
    <circle cx="890" cy="170" r="2"/>
    <circle cx="1000" cy="140" r="2.5"/>
  </g>

  <!-- Axis tick marks -->
  <g stroke="#555f70" stroke-width="1" stroke-opacity="0.2">
    <line x1="145" y1="170" x2="155" y2="170"/>
    <line x1="145" y1="260" x2="155" y2="260"/>
    <line x1="145" y1="350" x2="155" y2="350"/>
    <line x1="145" y1="440" x2="155" y2="440"/>
    <line x1="310" y1="525" x2="310" y2="535"/>
    <line x1="470" y1="525" x2="470" y2="535"/>
    <line x1="630" y1="525" x2="630" y2="535"/>
    <line x1="790" y1="525" x2="790" y2="535"/>
    <line x1="950" y1="525" x2="950" y2="535"/>
  </g>

  <!-- Corner accents -->
  <line x1="30" y1="30" x2="70" y2="30" stroke="#555f70" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="30" y1="30" x2="30" y2="70" stroke="#555f70" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="1170" y1="600" x2="1130" y2="600" stroke="#555f70" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="1170" y1="600" x2="1170" y2="560" stroke="#555f70" stroke-width="1" stroke-opacity="0.25"/>
</svg>
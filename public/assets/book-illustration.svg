<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 380" fill="none">
  <!-- Flat front cover of a book -->

  <!-- Subtle drop shadow -->
  <rect x="8" y="8" width="220" height="340" rx="4" fill="#1a1a1a" opacity="0.08"/>

  <!-- Cover -->
  <rect x="4" y="4" width="220" height="340" rx="3" fill="#0035a0"/>

  <!-- Subtle top-left radial glow -->
  <rect x="4" y="4" width="220" height="340" rx="3" fill="url(#coverGlow)"/>

  <!-- Top decorative band -->
  <rect x="4" y="44" width="220" height="1" fill="white" opacity="0.15"/>
  <rect x="4" y="56" width="220" height="0.5" fill="white" opacity="0.1"/>

  <!-- Bottom decorative band -->
  <rect x="4" y="300" width="220" height="0.5" fill="white" opacity="0.1"/>
  <rect x="4" y="310" width="220" height="1" fill="white" opacity="0.15"/>

  <!-- Publisher badge area -->
  <text x="30" y="34" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="white" opacity="0.35" letter-spacing="0.18em">O'REILLY</text>

  <!-- Title -->
  <text x="30" y="145" font-family="'Space Grotesk', sans-serif" font-size="36" font-weight="800" fill="white" opacity="0.95" letter-spacing="-0.01em">AGENT</text>
  <text x="30" y="185" font-family="'Space Grotesk', sans-serif" font-size="36" font-weight="800" fill="white" opacity="0.95" letter-spacing="-0.01em">MEMORY</text>

  <!-- Divider line -->
  <rect x="30" y="198" width="60" height="2" rx="1" fill="white" opacity="0.3"/>

  <!-- Subtitle -->
  <text x="30" y="222" font-family="'Inter', sans-serif" font-size="8.5" font-weight="400" fill="white" opacity="0.5" letter-spacing="0.02em">How AI systems remember,</text>
  <text x="30" y="234" font-family="'Inter', sans-serif" font-size="8.5" font-weight="400" fill="white" opacity="0.5" letter-spacing="0.02em">retrieve, compress, and act</text>
  <text x="30" y="246" font-family="'Inter', sans-serif" font-size="8.5" font-weight="400" fill="white" opacity="0.5" letter-spacing="0.02em">on information in production.</text>

  <!-- Author -->
  <text x="30" y="330" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="white" opacity="0.45" letter-spacing="0.12em">BEN LABASCHIN</text>

  <!-- Subtle spine edge on the left -->
  <rect x="4" y="4" width="4" height="340" rx="2" fill="#002480" opacity="0.5"/>

  <defs>
    <radialGradient id="coverGlow" cx="0.15" cy="0.12" r="0.85">
      <stop offset="0%" stop-color="white" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" fill="none">
  <!-- Standing hardcover book — matching reference silhouette exactly -->
  <!-- Slightly angled: spine visible on left, front cover facing right -->

  <!-- Page edges at top (thin white strips between covers) -->
  <path d="M 78 32 L 78 28 L 252 38 L 252 42 Z" fill="#f0ede6"/>
  <path d="M 78 28 L 78 24 L 252 34 L 252 38 Z" fill="#f5f2ec"/>
  <path d="M 78 24 L 78 20 L 252 30 L 252 34 Z" fill="#faf8f4"/>
  <path d="M 78 20 L 78 17 L 252 27 L 252 30 Z" fill="#fff"/>

  <!-- Spine (left side, slightly angled inward) -->
  <path d="M 38 8 L 78 17 L 78 378 L 38 366 Z" fill="#0035a0"/>

  <!-- Spine white bands — top -->
  <path d="M 42 38 L 74 45 L 74 52 L 42 45 Z" fill="white" opacity="0.35"/>
  <path d="M 42 58 L 74 65 L 74 68 L 42 61 Z" fill="white" opacity="0.25"/>

  <!-- Spine white bands — bottom -->
  <path d="M 42 318 L 74 325 L 74 332 L 42 325 Z" fill="white" opacity="0.35"/>
  <path d="M 42 338 L 74 345 L 74 348 L 42 341 Z" fill="white" opacity="0.25"/>

  <!-- Front cover (main face, solid fill) -->
  <path d="M 78 17 L 252 27 L 252 392 L 78 378 Z" fill="#0035a0"/>

  <!-- Title on cover -->
  <text x="100" y="160" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="800" fill="white" opacity="0.9" letter-spacing="0.02em">AGENT</text>
  <text x="100" y="198" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="800" fill="white" opacity="0.9" letter-spacing="0.02em">MEMORY</text>

  <!-- Thin divider -->
  <path d="M 100 210 L 156 212 L 156 213 L 100 211 Z" fill="white" opacity="0.3"/>

  <!-- Author -->
  <text x="100" y="310" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="white" opacity="0.4" letter-spacing="0.1em">BEN LABASCHIN</text>

  <!-- Bottom edge (thickness) -->
  <path d="M 38 366 L 78 378 L 252 392 L 252 398 L 78 384 L 38 372 Z" fill="#002a80"/>
</svg>

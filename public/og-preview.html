<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; background: #fef9ef; font-family: 'Inter', sans-serif; display: flex; overflow: hidden; }
  .left { flex: 1; padding: 6.67vw; display: flex; flex-direction: column; justify-content: center; }
  .right { width: 33.33vw; background: #0035a0; display: flex; align-items: center; justify-content: center; }
  .label { font-family: 'Space Grotesk', sans-serif; font-size: 1.17vw; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em; color: #0035a0; }
  .title { font-family: 'Space Grotesk', sans-serif; font-size: 6vw; font-weight: 900; color: #1d1c16; letter-spacing: -0.03em; line-height: 1.05; margin-top: 1.33vw; }
  .subtitle { font-size: 1.83vw; color: #555f70; line-height: 1.5; margin-top: 1.67vw; max-width: 42vw; }
  .url { font-family: 'Space Grotesk', sans-serif; font-size: 1.33vw; font-weight: 700; color: #0035a0; margin-top: auto; text-transform: uppercase; letter-spacing: 0.1em; }
  .right-text { color: #fff; text-align: center; padding: 3.33vw; }
  .right-text .big { font-family: 'Space Grotesk', sans-serif; font-size: 2.33vw; font-weight: 900; letter-spacing: 0.05em; }
  .right-text .small { font-size: 1.17vw; opacity: 0.7; margin-top: 1vw; line-height: 1.5; }
</style>
</head>
<body>
  <div class="left">
    <div class="label">AI/ML Engineering & Writing</div>
    <div class="title">ECONOBEN<br>.DEV</div>
    <div class="subtitle">Posts, talks, publications, and the work surrounding my upcoming O'Reilly book on AI agent memory.</div>
    <div class="url">econoben.dev</div>
  </div>
  <div class="right">
    <div class="right-text">
      <div class="big">PRINCIPAL AI/ML<br>ENGINEER</div>
      <div class="small">Writer &middot; Speaker<br>O'Reilly Author</div>
    </div>
  </div>
</body>
</html>
